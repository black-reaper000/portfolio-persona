<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.8" fill="#00e7ff" opacity=".3"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914"/>
      <stop offset=".5" stop-color="#06234a"/>
      <stop offset="1" stop-color="#001b7a"/>
    </linearGradient>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .mono { font-family: "Courier New", monospace; }
      .white { fill:#f7fbff; }
      .cyan { fill:#00e7ff; }
      .muted { fill:#b9d8ee; }
      .panel { fill:#071426; stroke:#00dfff; stroke-width:2; }
      .box { fill:#0a1d35; stroke:#00dfff; stroke-width:2; }
      .label { fill:#f7fbff; font-family:Arial,Helvetica,sans-serif; font-size:19px; font-weight:900; }
      .small { fill:#cfe8fa; font-family:Arial,Helvetica,sans-serif; font-size:14px; font-weight:700; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 0H1600L1320 250H0Z" fill="#071a31"/>
  <path d="M0 700L470 0H700L190 900H0Z" fill="#0046a8" opacity=".85"/>
  <path d="M1050 0H1600V900H1180L1480 0Z" fill="#00bfe9" opacity=".5"/>
  <path d="M0 850L500 180L730 250L190 900Z" fill="#00e7ff" opacity=".55"/>
  <rect x="30" y="30" width="1540" height="840" fill="url(#dots)"/>

  <!-- Header -->
  <text x="55" y="105" class="sans white" font-size="82" font-weight="900" font-style="italic" letter-spacing="-4">AFK BOT</text>
  <text x="57" y="137" class="sans cyan" font-size="17" font-weight="900" letter-spacing="5">ATERNOS SERVER AUTOMATION</text>

  <text x="1130" y="70" class="sans white" font-size="16" font-weight="800" letter-spacing="5">AUTOMATED ACTIVITY</text>
  <text x="1130" y="96" class="sans cyan" font-size="16" font-weight="800" letter-spacing="5">24 / 7 SERVER PRESENCE</text>

  <!-- Left: controller -->
  <path d="M85 190L430 165L460 210L115 235Z" fill="#f7fbff"/>
  <text x="145" y="214" class="sans" font-size="25" font-weight="900" fill="#071426">BOT CONTROLLER</text>

  <rect x="85" y="250" width="375" height="505" class="panel"/>

  <rect x="115" y="280" width="315" height="62" class="box"/>
  <text x="140" y="307" class="label">SERVER CONFIG</text>
  <text x="140" y="328" class="small">HOST / PORT / ACCOUNT</text>

  <rect x="115" y="360" width="315" height="62" class="box"/>
  <text x="140" y="387" class="label">LOGIN / SESSION</text>
  <text x="140" y="408" class="small">AUTHENTICATE BOT CLIENT</text>

  <rect x="115" y="440" width="315" height="62" class="box"/>
  <text x="140" y="467" class="label">PATH / MOVEMENT</text>
  <text x="140" y="488" class="small">AUTOMATED PLAYER ACTIONS</text>

  <rect x="115" y="520" width="315" height="62" class="box"/>
  <text x="140" y="547" class="label">BLOCK INTERACTION</text>
  <text x="140" y="568" class="small">MOVE / DIG / INTERACT</text>

  <rect x="115" y="600" width="315" height="62" class="box"/>
  <text x="140" y="627" class="label">ACTIVITY LOOP</text>
  <text x="140" y="648" class="small">REPEATED IN-GAME ACTIONS</text>

  <rect x="115" y="680" width="315" height="45" fill="#06182c" stroke="#00e7ff" stroke-dasharray="7 5"/>
  <text x="140" y="708" class="small">STATUS / LOGGING / ERRORS</text>

  <g class="cyan" font-size="24" font-family="Arial" text-anchor="middle">
    <text x="272" y="355">↓</text>
    <text x="272" y="435">↓</text>
    <text x="272" y="515">↓</text>
    <text x="272" y="595">↓</text>
    <text x="272" y="675">↓</text>
  </g>

  <!-- Center: network/server -->
  <path d="M565 190L950 165L980 210L595 235Z" fill="#f7fbff"/>
  <text x="635" y="214" class="sans" font-size="25" font-weight="900" fill="#071426">MINECRAFT CONNECTION</text>

  <rect x="565" y="250" width="415" height="505" class="panel"/>

  <rect x="600" y="290" width="345" height="78" class="box"/>
  <text x="628" y="320" class="label">BOT CLIENT</text>
  <text x="628" y="344" class="small">CONNECTS TO MINECRAFT SERVER</text>

  <rect x="600" y="405" width="345" height="92" fill="#003d82" stroke="#00e7ff" stroke-width="2"/>
  <text x="628" y="438" class="label">ATERNOS SERVER</text>
  <text x="628" y="463" class="small">FREE SERVER INSTANCE</text>
  <text x="628" y="483" class="small">PLAYER SESSION ACTIVE</text>

  <rect x="600" y="535" width="345" height="78" class="box"/>
  <text x="628" y="565" class="label">WORLD STATE</text>
  <text x="628" y="589" class="small">MOVEMENT / BLOCKS / POSITION</text>

  <rect x="600" y="650" width="345" height="65" fill="#06182c" stroke="#00e7ff" stroke-dasharray="7 5"/>
  <text x="628" y="678" class="label">EVENT / RESPONSE LOOP</text>
  <text x="628" y="700" class="small">ACTION → SERVER → RESPONSE</text>

  <!-- arrows center -->
  <g fill="none" stroke="#00e7ff" stroke-width="4">
    <path d="M460 395H555"/>
    <path d="M535 383L555 395L535 407"/>
    <path d="M980 450H1080"/>
    <path d="M1060 438L1080 450L1060 462"/>
    <path d="M980 570H1080"/>
    <path d="M1080 570L1060 558M1080 570L1060 582"/>
  </g>

  <!-- right: automation / resilience -->
  <path d="M1110 190L1480 165L1510 210L1140 235Z" fill="#f7fbff"/>
  <text x="1160" y="214" class="sans" font-size="25" font-weight="900" fill="#071426">AUTOMATION LOOP</text>

  <rect x="1110" y="250" width="400" height="505" class="panel"/>

  <rect x="1140" y="280" width="340" height="70" class="box"/>
  <text x="1165" y="309" class="label">MOVEMENT</text>
  <text x="1165" y="332" class="small">WALK / TURN / POSITION</text>

  <rect x="1140" y="375" width="340" height="70" class="box"/>
  <text x="1165" y="404" class="label">BLOCK ACTIONS</text>
  <text x="1165" y="427" class="small">DIG / PLACE / INTERACT</text>

  <rect x="1140" y="470" width="340" height="70" class="box"/>
  <text x="1165" y="499" class="label">IDLE PREVENTION</text>
  <text x="1165" y="522" class="small">PERIODIC PLAYER ACTIVITY</text>

  <rect x="1140" y="565" width="340" height="70" class="box"/>
  <text x="1165" y="594" class="label">RECONNECT</text>
  <text x="1165" y="617" class="small">RECOVER FROM DISCONNECTS</text>

  <rect x="1140" y="660" width="340" height="70" fill="#06182c" stroke="#00e7ff" stroke-dasharray="7 5"/>
  <text x="1165" y="689" class="label">MONITORING</text>
  <text x="1165" y="712" class="small">STATUS / HEALTH / EVENTS</text>

  <g class="cyan" font-size="24" font-family="Arial" text-anchor="middle">
    <text x="1310" y="368">↓</text>
    <text x="1310" y="463">↓</text>
    <text x="1310" y="558">↓</text>
    <text x="1310" y="653">↓</text>
  </g>

  <!-- visual connector -->
  <path d="M945 450 C1010 450 1045 420 1110 420" fill="none" stroke="#00e7ff" stroke-width="5"/>
  <path d="M1090 408L1110 420L1090 432" fill="#00e7ff"/>

  <!-- Footer -->
  <text x="60" y="825" class="sans cyan" font-size="14" font-weight="900" letter-spacing="4">ATERNOS / MINECRAFT / BOT AUTOMATION</text>
  <text x="1170" y="825" class="sans white" font-size="14" font-weight="900" letter-spacing="3">AUTOMATED ACTIVITY • CONTINUOUS LOOP</text>
</svg>